name: Publish images

# Builds the web and API images and pushes them to GHCR, so an installation can
# pull a released image instead of compiling one.
#
# Building from source is fine for development, but it makes every deployment
# reproduce the whole toolchain: an npm/Vite bundle, a Python image, and a
# builder cache that grows without bound on whatever machine happens to run it.
# Publishing here means a self-hoster runs `docker compose up -d` and gets the
# exact artifact CI tested.
#
# The trigger is the version tag rather than the merge, so an image exists for
# exactly the commits that were released. release.yml pushes that tag using
# RELEASE_PR_TOKEN (a PAT) rather than GITHUB_TOKEN, which is what allows this
# workflow to fire at all — tags pushed with GITHUB_TOKEN do not trigger
# workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and publish (e.g. v1.12.0)'
        required: true
      mark_latest:
        description: 'Also move the `latest` tag to this build'
        type: boolean
        default: false

# Least privilege: read the source, write the package, and mint an OIDC token
# for the provenance attestation. Nothing else.
permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

# Two tags pushed in quick succession should not race to publish.
concurrency:
  group: publish-images-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            context: apps/web
            target: production
          - app: api
            context: apps/api
            target: ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          REF: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action generates the OCI annotations (source, revision, created)
      # rather than a hand-written labels block that silently rots.
      #
      # `latest` moves on a real tag push, or when a dispatch explicitly asks for
      # it. A dispatch normally exists to backfill an older release and must not
      # drag `latest` backwards, so it is opt-in rather than automatic.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/homepool-${{ matrix.app }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.mark_latest }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # A signed, verifiable statement of which workflow and commit produced this
      # digest. Anyone can check it before running the image:
      #   gh attestation verify oci://ghcr.io/<owner>/homepool-web:<version> \
      #     -R <owner>/homepool
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/homepool-${{ matrix.app }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
