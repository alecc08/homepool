name: Release

# All component versions (HA integration manifest, web app, API) move in
# lockstep and are bumped exclusively by this workflow — never hand-edit a
# version field in manifest.json, apps/web/package.json, apps/web/package-lock.json,
# or apps/api/VERSION.
#
# Flow: version bumps happen AFTER a PR merges, not before. Bumping on the PR
# branch (the old approach) meant every open PR with a release label carried
# its own edit to manifest.json/package.json/etc, computed relative to
# whatever main looked like at label time — so the moment one PR merged, every
# other open PR's bump commit was now stale and conflicted on the same lines.
# Bumping only after merge, directly on main, means at most one bump is ever
# in flight per PR and PRs never touch these files themselves.
#
# On merge: read the release:* label straight off the merge event (Renovate
# applies its own via renovate.json; require-release-label.yml blocks merging
# anything without one), compute the next version relative to main's current
# manifest.json, and push the bump commit straight to main using
# RELEASE_PR_TOKEN (a fine-grained PAT) — not the default GITHUB_TOKEN, so the
# commit still triggers ci.yml for visibility. If two PRs merge close
# together, the push can race against a main that moved underneath it; that's
# handled by re-fetching and recomputing on each retry rather than assuming
# main is still where it was at checkout. Once the bump commit is on main, the
# same job tags it and publishes the release — no separate merge-time job
# needed since there's nothing left to gate.

on:
  pull_request:
    types: [closed]
    branches: [main, 'release/**']

permissions:
  contents: write

jobs:
  release:
    name: Bump version and publish release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Serialize post-merge bumps per target branch — merges that land close together
    # queue up here instead of racing to push the bump commit. The retry loop below
    # is still kept as a defense-in-depth for anything that slips through (e.g. a
    # concurrent push to the branch from outside this workflow).
    concurrency:
      group: release-bump-${{ github.event.pull_request.base.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Determine release level
        id: level
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          labels=$(echo "$LABELS_JSON" | jq -r '.[].name')
          level="none"
          if echo "$labels" | grep -qx "release:major"; then
            level="major"
          elif echo "$labels" | grep -qx "release:minor"; then
            level="minor"
          elif echo "$labels" | grep -qx "release:patch"; then
            level="patch"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Bump version on ${{ github.event.pull_request.base.ref }}
        if: steps.level.outputs.level != 'none'
        id: bump
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          LEVEL: ${{ steps.level.outputs.level }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin "$BASE_REF" --tags
            git reset --hard "origin/$BASE_REF"

            base_version=$(jq -r '.version' custom_components/homepool/manifest.json)
            IFS='.' read -r major minor patch <<< "$base_version"
            case "$LEVEL" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next_version="${major}.${minor}.${patch}"
            next_tag="v${next_version}"

            if git ls-remote --tags --exit-code origin "refs/tags/${next_tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${next_tag} already exists on origin — refusing to overwrite it. Check for a version mismatch between manifest.json (currently ${base_version} on ${BASE_REF}) and existing tags." >&2
              exit 1
            fi

            # HA integration manifest — the source of truth "base_version" reads from.
            jq --arg v "$next_version" '.version = $v' \
              custom_components/homepool/manifest.json > tmp.json
            mv tmp.json custom_components/homepool/manifest.json

            # Web app — metadata only, nothing reads this at runtime yet, kept in sync anyway.
            jq --arg v "$next_version" '.version = $v' \
              apps/web/package.json > tmp.json
            mv tmp.json apps/web/package.json
            jq --arg v "$next_version" '.packages[""].version = $v' \
              apps/web/package-lock.json > tmp.json
            mv tmp.json apps/web/package-lock.json

            # API backend — no packaging metadata of its own, so a plain VERSION file
            # (read by apps/api/main.py) is its version source.
            echo "$next_version" > apps/api/VERSION

            today=$(date -u +%Y-%m-%d)
            python3 - "$next_version" "$today" <<'EOF'
          import sys

          version, today = sys.argv[1], sys.argv[2]
          path = "CHANGELOG.md"
          with open(path) as f:
              content = f.read()

          heading = "## [Unreleased]"
          new_heading = f"## [{version}] - {today}"
          if new_heading not in content:
              idx = content.index(heading)
              insert_at = idx + len(heading)
              content = content[:insert_at] + f"\n\n{new_heading}" + content[insert_at:]
              with open(path, "w") as f:
                  f.write(content)
          EOF

            git add custom_components/homepool/manifest.json CHANGELOG.md \
              apps/web/package.json apps/web/package-lock.json apps/api/VERSION
            git commit -m "chore: release ${next_tag}"

            if git push origin "HEAD:$BASE_REF"; then
              echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
              echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push to $BASE_REF raced with another merge (attempt $attempt) — retrying against the latest tip."
          done

          echo "::error::Failed to push the version bump after multiple attempts — $BASE_REF kept moving underneath us." >&2
          exit 1

      - name: Tag and publish release
        if: steps.bump.outputs.next_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.bump.outputs.next_tag }}"
          git push origin "${{ steps.bump.outputs.next_tag }}"
          gh release create "${{ steps.bump.outputs.next_tag }}" --generate-notes
