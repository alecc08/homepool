log_measurement:
  name: Log measurement
  description: Records a water measurement (pH, chlorine, etc.) for a homepool installation.
  fields:
    installation_id:
      name: Installation ID
      description: The homepool installation to log the measurement for.
      required: true
      example: 1
      selector:
        number:
          min: 1
          mode: box
    date:
      name: Date
      description: Day the measurement was taken. Leave empty for today — set it to log a reading you took earlier and forgot to record.
      example: "2026-07-24"
      selector:
        date:
    ph:
      name: pH
      description: pH value.
      example: 7.2
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
          mode: box
    chlorine:
      name: Free chlorine
      description: Free chlorine concentration.
      example: 1.5
      selector:
        number:
          min: 0
          mode: box
    bromine:
      name: Bromine
      description: Total bromine concentration.
      example: 3
      selector:
        number:
          min: 0
          mode: box
    tac:
      name: TAC
      description: Total alkalinity.
      example: 120
      selector:
        number:
          min: 0
          mode: box
    hardness:
      name: Hardness
      description: Total hardness.
      example: 250
      selector:
        number:
          min: 0
          mode: box
    salt:
      name: Salt
      description: Salt concentration.
      example: 3000
      selector:
        number:
          min: 0
          mode: box
    stabilizer:
      name: Stabilizer (CYA)
      description: Cyanuric acid concentration.
      example: 40
      selector:
        number:
          min: 0
          mode: box
    cc:
      name: Combined chlorine
      description: Combined chlorine concentration.
      example: 0.1
      selector:
        number:
          min: 0
          mode: box
    temp:
      name: Temperature
      description: Water temperature.
      example: 26
      selector:
        number:
          mode: box
    notes:
      name: Notes
      description: Optional free-text notes.
      example: Test strip reading
      selector:
        text:

log_maintenance:
  name: Log maintenance
  description: Records a maintenance task as done for a homepool installation.
  fields:
    installation_id:
      name: Installation ID
      description: The homepool installation to log the maintenance for.
      required: true
      example: 1
      selector:
        number:
          min: 1
          mode: box
    task:
      name: Task
      description: The task to mark done, given as its task key — the `task_key` attribute published by that task's "days until due" sensor and "log" button.
      required: true
      example: filter_maintenance
      selector:
        text:
    date:
      name: Date
      description: Day the task was done. Leave empty for today — set it to log maintenance you did earlier and forgot to record.
      example: "2026-07-24"
      selector:
        date:
    notes:
      name: Notes
      description: Optional free-text notes.
      example: Backwashed until the sight glass ran clear
      selector:
        text:
