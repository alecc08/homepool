name: HACS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mount the repo root, not custom_components/ itself: the hassfest
      # entrypoint only looks for manifests at custom_components/*/manifest.json
      # (two levels below the mounted workspace) or ./manifest.json at the
      # workspace root, so custom_components/ has to exist as a subdirectory
      # of what's mounted. It no longer globs the whole tree for stray
      # manifest.json files (e.g. apps/web/public/manifest.json, the PWA
      # manifest), so mounting the full repo is safe.
      - name: Hassfest validation
        run: docker run --rm -v "${{ github.workspace }}:/github/workspace" ghcr.io/home-assistant/hassfest
